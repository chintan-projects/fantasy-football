# Every TODO in code needs an entry here. Newest first.
bugs:
  - id: BUG-013
    title: Two shapes were persisted for one recommendation, and calibration could read one
    found: 2026-09-13
    status: fixed
    detail: >
      ff_recommend_lineup stored its starters as objects with player_id and slot; the
      Sunday scheduler stored the same thing as two-tuples. Nothing compared them, so both
      looked correct for as long as nothing read them back.
      Calibration reads them back. It parsed the tuple form, so every lineup the scheduler
      recommended -- which is every lineup produced without the owner asking, the majority
      of them -- would have been skipped. Not failed: skipped, silently, leaving a report
      that looked complete and covered a biased subset of weeks.
      The scheduler now writes the object form. The reader still accepts both, because
      rows in the old shape are on disk and are perfectly gradeable; that tolerance is for
      persisted history, not for a second live format.
      Found by a test failing on fixture data, before any real week was lost.
    severity: medium
    fixed_in: >
      backend/src/ff/api/scheduler.py, backend/src/ff/services/calibration.py, and
      tests/test_mcp.py (test_the_lineup_grade_compares_against_the_obvious_lineup_not_perfection)

  - id: BUG-012
    title: Per-source projections were averaged away, making the headline metric impossible
    found: 2026-09-13
    status: fixed
    detail: >
      CLAUDE.md 2.5 asks for MAE per source per week and calls it the single most important
      observability requirement in the project. It could not be computed. services/
      projections.py built a dict of per-source means, passed it to domain.blend, and blend
      returned a Projection carrying the ensemble mean and the source *names* only. The
      numbers were discarded in memory, before anything was persisted.
      The severity is in the direction of the loss: it is not recoverable later. Re-fetching
      next week returns what the sources believe then, and a source cannot be graded on a
      forecast it no longer admits to making. Every week that passed was a week that could
      never be scored per source.
      Projection now carries per_source and the week snapshot persists it. Snapshots written
      before this change have the ensemble only, and services/calibration.py reports them as
      unscorable per source rather than raising -- that is a fact about the data.
      Found while building M6, by asking what the calibration code would actually read.
    severity: high
    fixed_in: >
      backend/src/ff/domain/models.py, backend/src/ff/domain/blend.py,
      backend/src/ff/services/week.py, regression test
      test_an_old_snapshot_without_per_source_numbers_is_unscorable_per_source

  - id: BUG-011
    title: Claude could not connect, because the server advertised a capability it could not use
    found: 2026-09-13
    status: fixed
    detail: >
      Adding the custom connector ended at an error page reading "Client Not Registered:
      the client ID https://claude.ai/oauth/mcp-oauth-client-metadata was not found in the
      server's client registry".
      FastMCP's GitHubProvider enables client id metadata documents by default, so the
      discovery document advertised client_id_metadata_document_supported and Claude
      preferred it over dynamic registration. That form identifies the client by URL, which
      obliges this server to fetch that URL before it can recognise the client. From inside
      the Fly machine that fetch returns 403 with an HTML bot challenge -- Cloudflare does
      not trust a datacenter IP -- while the identical request from a laptop returns clean
      JSON. CIMDClientManager catches the failure, logs a warning, returns None, and the
      authorize handler renders the error page. Nothing in the logs says "blocked".
      Fixed by passing enable_cimd=False, which drops the advertisement and lets Claude
      register dynamically instead. Registration is inbound, so there is no outbound fetch
      to fail and no dependency on anyone else's bot protection. The alternative -- sending
      a browser user agent to get past the challenge -- was rejected: it defeats a
      protection mechanism to keep a dependency this server does not need.
    severity: high
    fixed_in: >
      backend/src/ff/api/auth.py, regression test
      test_the_server_never_asks_claude_for_a_metadata_document in tests/test_mcp.py

  - id: BUG-010
    title: The ASGI app could not start, and no test would have caught it
    found: 2026-09-13
    status: fixed
    detail: >
      The scheduler was attached with app.router.on_startup, which Starlette's Router does
      not have when FastMCP builds the app -- the Streamable HTTP transport supplies its
      own lifespan. uvicorn died on import. Every MCP test called build_server directly, so
      the whole suite was green against a server that could not boot.
      Fixed by wrapping FastMCP's own lifespan rather than replacing or bypassing it, which
      also matters for a subtler reason: replacing it would leave the session manager
      unstarted, and every tool call would fail on a server that looked healthy.
    severity: high
    fixed_in: >
      backend/src/ff/api/mcp.py, regression tests
      test_the_asgi_app_starts_and_serves_health and
      test_the_mcp_endpoint_is_mounted_where_claude_expects_it in tests/test_mcp.py

  - id: BUG-009
    title: A projection source with no adapter was dropped silently, leaving one source
    found: 2026-09-13
    status: fixed
    detail: >
      Settings validates that at least two projection sources are named, counting strings.
      build_deps then built only the names it recognised and discarded the rest. With
      FF_PROJECTION_SOURCES naming espn and fantasypros -- which is what the local
      environment file still held after FantasyPros was dropped -- validation passed, one
      source was built, and /health cheerfully reported a single source.
      One source is the state this project treats as a misconfiguration: the epistemic
      spread in a Projection is cross-source disagreement, so with a single source it is
      not measured, it is invented, and the number is a different quantity wearing the same
      type. Now an unbuildable name raises ConfigError naming it and listing what is
      available, and fewer than two surviving sources raises as well.
      Found by booting the server and reading /health, not by a test.
    severity: high
    fixed_in: >
      backend/src/ff/api/deps.py, regression tests in tests/test_config.py
      (TestProjectionSourcesActuallyExist)
    action_required: >
      FF_PROJECTION_SOURCES in the local environment file still names fantasypros and the
      server will now refuse to start until it names espn and sleeper. That file is on the
      tool deny list, so it is a manual edit.

  - id: BUG-008
    title: The lineup plan contradicted its own per-slot explanation
    found: 2026-09-13
    status: fixed
    detail: >
      One call to ff_recommend_lineup returned a plan starting Brock Bowers at TE and, in
      the same response, a verdict for the TE slot reading "start Trey McBride". The plan
      came from the simulated best lineup; the verdicts came from contested_slots, which
      derives from the greedy highest-projection lineup. Whenever the simulation preferred
      a variant, the two halves described different lineups.
      A second defect sat underneath it: when the single-swap variant was not among the
      enumerated lineups, the delta defaulted to 0.0, which decide() reads as a dead heat.
      So "too close to call" -- the one output this project treats as sacred -- was being
      printed for swaps that had never been simulated at all.
      Both fixed in services/recommend.py. Verdicts are now read off the recommended
      lineup, an unsimulated swap is omitted rather than reported as a tie, and a plan that
      beats the greedy lineup by less than NOISE_THRESHOLD_WIN_PROB falls back to greedy
      rather than churning the roster on noise.
      Found by reading the mcp_demo output, not by a failing test. Every unit test passed
      throughout, because each half was correct in isolation.
    severity: high
    fixed_in: >
      backend/src/ff/services/recommend.py, regression test
      test_the_plan_and_its_own_verdicts_never_disagree in tests/test_mcp.py

  - id: KNOWN-001
    title: Yahoo exposes winning FAAB bids only, so the bid distribution is unobservable
    found: 2026-09-13
    status: known_limitation
    detail: >
      /league/{key}/transactions reports a completed add with the faab_bid that WON. The
      bids that lost are not in the API at all. So the opponent model can learn a
      position's clearing price, and it cannot learn how many managers bid, what the
      runner-up offered, or how close the auction was. credible_bidders therefore counts
      who COULD have bid -- managers with the budget and a history at the position -- which
      is an upper bound on real competition. An upper bound on n makes the (n-1)/n shading
      weaker, so the error bids HIGH, not low. That direction is written into the
      docstring and asserted by a test, because a correction whose sign is unknown is worse
      than no correction at all.
      Not fixable inside the API. Losing bids are visible in the Yahoo desktop UI's
      transaction detail view, so a scraper could capture them -- see the PROGRESS.yaml
      backlog item. Until then the model says what it does not know.
    severity: medium
    affects: >
      backend/src/ff/domain/opponent.py (credible_bidders, expected_clearing_price),
      and through them every FAAB bid recommendation

  - id: BUG-007
    title: ESPN's "no projection" zero was being blended as if it were a forecast
    found: 2026-09-13
    status: fixed
    detail: >
      ESPN renders "we have no number for this player this week" as appliedTotal 0.0 with
      an empty stat line, and it does this for 22.4% of the players it returns -- everyone
      listed OUT, plus anyone it has not modelled. weekly_projection took that at face
      value, so the blend averaged a real projection against a phantom zero and halved it.
      Brock Bowers came back 0.00 from ESPN against 15.14 from Sleeper; the ensemble would
      have called it 7.57 and sat him or started him on a number that was wrong in both
      directions. A zero WITH a stat line is a genuine forecast and is still kept.
      Not reachable from any single-source test -- it took comparing two sources live,
      which is the argument for the ensemble restated as a defect.
    severity: high
    fixed_in: >
      backend/src/ff/adapters/espn.py, fixture
      tests/fixtures/espn/zero_means_no_projection.json (recorded live),
      regression tests in tests/test_espn.py
    verified: >
      Against the live endpoint: ESPN's usable keys fell from 577 to 448 with zero
      remaining 0.00 values, and the maximum disagreement with Sleeper fell from 15.14
      points to 5.89.

  - id: BUG-006
    title: An unapprovable 401 was retried four times and then blamed on throttling
    found: 2026-09-13
    status: fixed
    detail: >
      _handle_auth_failure treated any body containing "oauth_problem" as a stale token:
      refresh, then raise Throttled so the backoff wrapper runs the call again. Yahoo's
      answer for an app that is not approved for the Fantasy Sports API is
      oauth_problem="additional_authorization_required", which no refresh can ever fix. So
      a first real read spent 25 seconds on four doomed attempts and then reported "yahoo
      throttled" -- while the actual cause sat in the first response body. Only
      token_expired is refreshable now. additional_authorization_required raises straight
      away with both of its possible causes and what to do about each, and any other 401
      quotes what Yahoo actually said instead of guessing at a scope mismatch.
    severity: high
    fixed_in: >
      backend/src/ff/adapters/yahoo/client.py, regression tests in
      tests/test_yahoo_client.py
    verified: >
      `make leagues` against the live API now fails in under a second with the real
      reason, where it previously looped for 25 seconds and named the wrong one.

  - id: BUG-005
    title: The OAuth callback reported a guess, then hung forever
    found: 2026-09-13
    status: fixed
    detail: >
      The local listener only looked for a "code" parameter. Yahoo puts its refusals in the
      same query string, so every failure rendered the same wrong sentence -- "No code in
      the callback, check the redirect URI" -- when the redirect URI was fine and the real
      answer (error=invalid_scope) was sitting two parameters away. Worse, the wait loop
      spun until the user killed it, because a code was never coming. Parsing now lives in
      a tested pure function that reads Yahoo's error, renders it, and ends the wait.
    severity: medium
    fixed_in: >
      backend/src/ff/adapters/yahoo/auth.py (parse_callback, CallbackResult),
      scripts/yahoo_auth.py, regression tests in tests/test_yahoo_auth.py

  - id: BUG-004
    title: make auth asked for write scope and so got no token at all
    found: 2026-09-13
    status: fixed
    detail: >
      authorize_url hardcoded fspt-w and Yahoo answered error=invalid_scope. The first fix
      assumed this meant "write not granted yet" and switched the default to fspt-r. Yahoo
      refused that too. Probing the request_auth endpoint directly for all three cases
      settled it: fspt-r is refused, fspt-w is refused, and sending NO scope parameter
      reaches the login page. Yahoo takes permissions from the app's own developer-portal
      settings; an explicit scope string is not how you ask for access, it is how you fail
      the handshake. The default is now to omit it. FF_YAHOO_SCOPE survives only so the
      documented behaviour can be re-tested if Yahoo ever restores it. Every integration
      guide saying otherwise -- including this project's own yahoo-fantasy-api skill -- is
      stale on this point.
    severity: high
    fixed_in: >
      backend/src/ff/adapters/yahoo/auth.py, backend/src/ff/core/config.py,
      scripts/yahoo_auth.py, .env.example, regression tests in tests/test_yahoo_auth.py
    verified: >
      The URL built from the shipped defaults was replayed against
      api.login.yahoo.com/oauth2/request_auth on 2026-09-13 and returned a 302 to the
      Yahoo login page rather than an error.

  - id: BUG-003
    title: A blank value in the environment file stops the whole app from starting
    found: 2026-09-13
    status: fixed
    detail: >
      FF_RANDOM_SEED= (present, empty) is how people write "leave this unset", and the
      shipped template did exactly that. Pydantic passed an empty string to an int | None
      field and Settings() raised, so every make target died before doing anything. Fixed
      with a before-validator that treats blank as unset; a non-numeric value still raises,
      because that is a typo someone needs told about. The template now comments the line
      out rather than shipping a blank.
    severity: high
    fixed_in: backend/src/ff/core/config.py, regression test tests/test_config.py

  - id: BUG-002
    title: The repo-root environment file was invisible to every make target
    found: 2026-09-13
    status: fixed
    detail: >
      Settings used a bare relative env_file, which resolves against the process working
      directory. Every make target runs "cd backend" first, so the file at the repo root
      was never read and `make auth` reported missing credentials that were sitting right
      there. The workaround people reach for -- copying the file into backend/ -- leaves
      two secret files that drift apart. Fixed by walking up from the module to the
      directory holding the Makefile.
    severity: high
    fixed_in: backend/src/ff/core/config.py, regression test tests/test_config.py

  - id: BUG-001
    title: mypy --strict fails on adapters/yahoo/executors.py
    found: 2026-09-12
    detail: >
      Two errors, both pre-existing and both in the write path: the registry decorator is
      typed Callable[[], T] but receives a class, and the getattr call carries an unused
      type: ignore. `make check` does not catch them because it runs mypy over domain/ and
      services/ only, per CLAUDE.md 2.6. Every other adapter passes mypy --strict.
      Left alone deliberately -- the write path is out of scope for M1 and M2 and is not
      worth touching while M5 is blocked on Yahoo write access.
    severity: low
    repro: cd backend && uv run mypy src/ff/adapters

known_limitations:
  - id: LIM-1
    title: Winner's curse shading constants are a calibrated guess
    detail: >
      domain/faab.winners_curse_shading grows with the bidder count, which is what theory
      guarantees. The specific coefficients are not derived and not backtested. Treat bid
      sizes as directional until M6 can score them against real outcomes.
    severity: medium

  - id: LIM-2
    title: Gamma quantiles use a Wilson-Hilferty approximation
    detail: >
      domain/distributions avoids a scipy dependency by approximating the Gamma inverse CDF.
      Accurate to within a few percent in the tails, which is well inside the precision this
      problem supports -- projections explain 3-23% of variance. Revisit only if a
      calibration study shows tail bias.
    severity: low

  - id: LIM-3
    title: Correlation priors are archetype-level, not per-player
    detail: >
      Deliberate. A specific QB-WR pair shares a handful of games, so a fitted per-pair
      correlation is noise. Do not "improve" this without a study showing otherwise.
    severity: low

  - id: LIM-4
    title: ESPN endpoints are undocumented and unversioned
    detail: >
      No contract, no deprecation notice. Schema validation on every fetch is required, and
      ESPN must never be a required source.
    severity: medium
