# Every TODO in code needs an entry here. Newest first.
bugs:
  - id: BUG-007
    title: ESPN's "no projection" zero was being blended as if it were a forecast
    found: 2026-09-13
    status: fixed
    detail: >
      ESPN renders "we have no number for this player this week" as appliedTotal 0.0 with
      an empty stat line, and it does this for 22.4% of the players it returns -- everyone
      listed OUT, plus anyone it has not modelled. weekly_projection took that at face
      value, so the blend averaged a real projection against a phantom zero and halved it.
      Brock Bowers came back 0.00 from ESPN against 15.14 from Sleeper; the ensemble would
      have called it 7.57 and sat him or started him on a number that was wrong in both
      directions. A zero WITH a stat line is a genuine forecast and is still kept.
      Not reachable from any single-source test -- it took comparing two sources live,
      which is the argument for the ensemble restated as a defect.
    severity: high
    fixed_in: >
      backend/src/ff/adapters/espn.py, fixture
      tests/fixtures/espn/zero_means_no_projection.json (recorded live),
      regression tests in tests/test_espn.py
    verified: >
      Against the live endpoint: ESPN's usable keys fell from 577 to 448 with zero
      remaining 0.00 values, and the maximum disagreement with Sleeper fell from 15.14
      points to 5.89.

  - id: BUG-006
    title: An unapprovable 401 was retried four times and then blamed on throttling
    found: 2026-09-13
    status: fixed
    detail: >
      _handle_auth_failure treated any body containing "oauth_problem" as a stale token:
      refresh, then raise Throttled so the backoff wrapper runs the call again. Yahoo's
      answer for an app that is not approved for the Fantasy Sports API is
      oauth_problem="additional_authorization_required", which no refresh can ever fix. So
      a first real read spent 25 seconds on four doomed attempts and then reported "yahoo
      throttled" -- while the actual cause sat in the first response body. Only
      token_expired is refreshable now. additional_authorization_required raises straight
      away with both of its possible causes and what to do about each, and any other 401
      quotes what Yahoo actually said instead of guessing at a scope mismatch.
    severity: high
    fixed_in: >
      backend/src/ff/adapters/yahoo/client.py, regression tests in
      tests/test_yahoo_client.py
    verified: >
      `make leagues` against the live API now fails in under a second with the real
      reason, where it previously looped for 25 seconds and named the wrong one.

  - id: BUG-005
    title: The OAuth callback reported a guess, then hung forever
    found: 2026-09-13
    status: fixed
    detail: >
      The local listener only looked for a "code" parameter. Yahoo puts its refusals in the
      same query string, so every failure rendered the same wrong sentence -- "No code in
      the callback, check the redirect URI" -- when the redirect URI was fine and the real
      answer (error=invalid_scope) was sitting two parameters away. Worse, the wait loop
      spun until the user killed it, because a code was never coming. Parsing now lives in
      a tested pure function that reads Yahoo's error, renders it, and ends the wait.
    severity: medium
    fixed_in: >
      backend/src/ff/adapters/yahoo/auth.py (parse_callback, CallbackResult),
      scripts/yahoo_auth.py, regression tests in tests/test_yahoo_auth.py

  - id: BUG-004
    title: make auth asked for write scope and so got no token at all
    found: 2026-09-13
    status: fixed
    detail: >
      authorize_url hardcoded fspt-w and Yahoo answered error=invalid_scope. The first fix
      assumed this meant "write not granted yet" and switched the default to fspt-r. Yahoo
      refused that too. Probing the request_auth endpoint directly for all three cases
      settled it: fspt-r is refused, fspt-w is refused, and sending NO scope parameter
      reaches the login page. Yahoo takes permissions from the app's own developer-portal
      settings; an explicit scope string is not how you ask for access, it is how you fail
      the handshake. The default is now to omit it. FF_YAHOO_SCOPE survives only so the
      documented behaviour can be re-tested if Yahoo ever restores it. Every integration
      guide saying otherwise -- including this project's own yahoo-fantasy-api skill -- is
      stale on this point.
    severity: high
    fixed_in: >
      backend/src/ff/adapters/yahoo/auth.py, backend/src/ff/core/config.py,
      scripts/yahoo_auth.py, .env.example, regression tests in tests/test_yahoo_auth.py
    verified: >
      The URL built from the shipped defaults was replayed against
      api.login.yahoo.com/oauth2/request_auth on 2026-09-13 and returned a 302 to the
      Yahoo login page rather than an error.

  - id: BUG-003
    title: A blank value in the environment file stops the whole app from starting
    found: 2026-09-13
    status: fixed
    detail: >
      FF_RANDOM_SEED= (present, empty) is how people write "leave this unset", and the
      shipped template did exactly that. Pydantic passed an empty string to an int | None
      field and Settings() raised, so every make target died before doing anything. Fixed
      with a before-validator that treats blank as unset; a non-numeric value still raises,
      because that is a typo someone needs told about. The template now comments the line
      out rather than shipping a blank.
    severity: high
    fixed_in: backend/src/ff/core/config.py, regression test tests/test_config.py

  - id: BUG-002
    title: The repo-root environment file was invisible to every make target
    found: 2026-09-13
    status: fixed
    detail: >
      Settings used a bare relative env_file, which resolves against the process working
      directory. Every make target runs "cd backend" first, so the file at the repo root
      was never read and `make auth` reported missing credentials that were sitting right
      there. The workaround people reach for -- copying the file into backend/ -- leaves
      two secret files that drift apart. Fixed by walking up from the module to the
      directory holding the Makefile.
    severity: high
    fixed_in: backend/src/ff/core/config.py, regression test tests/test_config.py

  - id: BUG-001
    title: mypy --strict fails on adapters/yahoo/executors.py
    found: 2026-09-12
    detail: >
      Two errors, both pre-existing and both in the write path: the registry decorator is
      typed Callable[[], T] but receives a class, and the getattr call carries an unused
      type: ignore. `make check` does not catch them because it runs mypy over domain/ and
      services/ only, per CLAUDE.md 2.6. Every other adapter passes mypy --strict.
      Left alone deliberately -- the write path is out of scope for M1 and M2 and is not
      worth touching while M5 is blocked on Yahoo write access.
    severity: low
    repro: cd backend && uv run mypy src/ff/adapters

known_limitations:
  - id: LIM-1
    title: Winner's curse shading constants are a calibrated guess
    detail: >
      domain/faab.winners_curse_shading grows with the bidder count, which is what theory
      guarantees. The specific coefficients are not derived and not backtested. Treat bid
      sizes as directional until M6 can score them against real outcomes.
    severity: medium

  - id: LIM-2
    title: Gamma quantiles use a Wilson-Hilferty approximation
    detail: >
      domain/distributions avoids a scipy dependency by approximating the Gamma inverse CDF.
      Accurate to within a few percent in the tails, which is well inside the precision this
      problem supports -- projections explain 3-23% of variance. Revisit only if a
      calibration study shows tail bias.
    severity: low

  - id: LIM-3
    title: Correlation priors are archetype-level, not per-player
    detail: >
      Deliberate. A specific QB-WR pair shares a handful of games, so a fitted per-pair
      correlation is noise. Do not "improve" this without a study showing otherwise.
    severity: low

  - id: LIM-4
    title: ESPN endpoints are undocumented and unversioned
    detail: >
      No contract, no deprecation notice. Schema validation on every fetch is required, and
      ESPN must never be a required source.
    severity: medium
